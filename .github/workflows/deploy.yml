name: Build and deploy notes

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # extra LaTeX files kept in the repo (see texmf/README.md)
      TEXMFHOME: ${{ github.workspace }}/texmf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Only what the build uses (checked with xelatex -recorder):
      #   texlive-xetex       XeLaTeX (also pulls in texlive-latex-extra: tcolorbox, titlesec, enumitem)
      #   texlive-pictures    TikZ, for the figures
      #   texlive-lang-cjk    xeCJK; its helper ctexhook.sty is in texmf/ instead of the 50 MB texlive-lang-chinese
      #   texlive-fonts-recommended  rsfs fonts for \mathscr
      #   fonts-noto-cjk      the Chinese font
      # --no-install-recommends skips hundreds of MB of extras, and turning off
      # man-db skips rebuilding the manual page index after the install.
      - name: Install TeX (for the PDF and the TikZ figures)
        run: |
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-xetex texlive-pictures texlive-lang-cjk \
            texlive-fonts-recommended fonts-noto-cjk

      - name: Install PreTeXt
        run: pip install -r requirements.txt

      - name: Build website
        run: pretext build web

      # If the PDF fails, still publish the website (the error stays visible in this step's log)
      - name: Build PDF
        continue-on-error: true
        run: pretext build print

      - name: Put the PDF on the website
        run: |
          if [ -f output/print/main.pdf ]; then
            cp output/print/main.pdf output/web/analysis-i-notes.pdf
          else
            echo "::warning::PDF was not built; publishing the website without it."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
